name: Build and Publish Wheels

on:
  release:
    types: [published]
  workflow_dispatch: # Allows manual triggering for testing

jobs:
  build_wheels:
      name: Build wheels on ${{ matrix.os }}
      runs-on: ${{ matrix.os }}
      
      # 1. Fix for the Node.js 20 deprecation warning
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        
      strategy:
        matrix:
          os: [ubuntu-latest, windows-latest, macos-latest]

      steps:
        - uses: actions/checkout@v4

        # 2. Cache block to fix the HTTP 429 Too Many Requests error
        - name: Cache cibuildwheel downloads
          uses: actions/cache@v4
          env:
            cache-name: cache-cibuildwheel
          with:
            path: |
              ~/.cache/cibuildwheel
              ~/Library/Caches/cibuildwheel
              ~\AppData\Local\cibuildwheel\Cache
            key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ github.sha }}
            restore-keys: |
              ${{ runner.os }}-build-${{ env.cache-name }}-
              ${{ runner.os }}-build-
              ${{ runner.os }}-

        # 3. Upgraded cibuildwheel version
        - name: Build wheels
          uses: pypa/cibuildwheel@v2.22.0
          env:
            # SKIP: Old Python, PyPy, Musl (Alpine), and 32-bit Linux
            CIBW_SKIP: "cp36-* cp37-* cp38-* pp* *musllinux* *i686*"
            
            # WINDOWS: Force 64-bit only to prevent MSVC uint64_t pointer crashes
            CIBW_ARCHS_WINDOWS: "AMD64"
            
            # LINUX: Force C++20 for GraphZero v0.2 (<std::span> support)
            CIBW_ENVIRONMENT_LINUX: "CXXFLAGS='-std=c++20'"
            
            # MACOS: Install OpenMP, configure paths, and force C++20
            CIBW_BEFORE_ALL_MACOS: "brew install libomp"
            CIBW_ENVIRONMENT_MACOS: >
              CFLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
              CXXFLAGS="-std=c++20 -Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include"
              LDFLAGS="-L$(brew --prefix libomp)/lib -lomp"
              OpenMP_ROOT="$(brew --prefix libomp)"
            # MACOS: Prevent cross-compilation errors (build arm64 on arm64 runner)
            CIBW_ARCHS_MACOS: "auto"

        - uses: actions/upload-artifact@v4
          with:
            name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
            path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  publish_to_pypi:
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_PASSWORD }}